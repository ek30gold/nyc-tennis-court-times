name: fetch-reservations
on:
  # CI runner IPs are WAF-walled (grid never renders there). Manual-dispatch only;
  # the nightly refresh runs agent-side through the cloud browser instead.
  # schedule:
  #   - cron: "30 23 * * *"   # 7:30pm ET - tonight's grids forecast tomorrow
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python scripts/fetch_reservations.py
      - name: commit density
        run: |
          git config user.name "tennis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/reservation_density.json
          git diff --cached --quiet || git commit -m "reservations $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
