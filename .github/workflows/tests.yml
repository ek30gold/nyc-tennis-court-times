name: tests
on:
  push:
    paths: [scripts/**, tests/**, .github/workflows/tests.yml]
  pull_request:
    paths: [scripts/**, tests/**, .github/workflows/tests.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # stdlib unittest only - no dependencies to install
      - run: python -m unittest discover -s tests -v
