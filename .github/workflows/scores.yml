name: refresh-scores
on:
  schedule:
    - cron: "7 * * * *"   # top of every hour, ~7 min past to dodge the :00 rush
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/fetch_courts.py
      - run: python scripts/fetch_closures.py
      - run: python scripts/fetch_amenities.py
      - run: python scripts/compute_scores.py
      - name: commit scores
        run: |
          git config user.name "tennis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/courts.geojson data/closures.json data/amenities.json web/scores.json
          git diff --cached --quiet || git commit -m "scores $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
