<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Tennis Wait Times</title>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<style>body{margin:0;font-family:system-ui}#map{height:100vh}.legend{position:fixed;bottom:12px;left:12px;background:#fff;padding:8px 10px;border-radius:6px;font-size:12px;box-shadow:0 1px 4px #0003;max-width:280px}.picker{position:fixed;top:12px;left:12px;background:#fff;padding:8px 10px;border-radius:6px;font-size:13px;box-shadow:0 1px 4px #0003}.picker input{font-size:13px}.picker .note{color:#777;font-size:11px;max-width:230px}</style>
</head><body>
<div id="map"></div>
<div class="picker">
<b>Forecast wait for:</b><br>
<input type="datetime-local" id="when"> <button id="now">Now</button>
<div class="note" id="pnote">Showing current conditions. Pick a date + time (NYC time) to forecast.</div>
</div>
<div class="legend">
<b>Expected wait</b><br>
<span style="color:#2ca02c">&#9679;</span> walk-on &nbsp;
<span style="color:#ffd400">&#9679;</span> short &nbsp;
<span style="color:#ff7f0e">&#9679;</span> 30-60 min &nbsp;
<span style="color:#d62728">&#9679;</span> 1h+
<div id="updated"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
window.addEventListener("error",e=>{const u=document.getElementById("updated");if(u)u.textContent="JS error: "+e.message;});
const COLORS = {"walk-on":"#2ca02c","short":"#ffd400","30-60 min":"#ff7f0e","1h+":"#d62728"};
function band(s){return s<0.35?"walk-on":s<0.65?"short":s<1.1?"30-60 min":"1h+";}
function baseline(hour, dow){
  const ep=Math.exp(-(((hour-18)/2.5)**2)), mp=Math.exp(-(((hour-10)/2.5)**2));
  return Math.min(0.25+(dow<5?0.55*ep:0.65*mp),1.0);}
function wmod(pNow, recent){return pNow>0?0.0:(recent>1.0?1.5:1.0);}
const map = new maplibregl.Map({container:"map",
  style:"https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center:[-73.95,40.73], zoom:10.5});
window.__t={map};
let DATA=null, MODEL=null, WXP={};
map.on("load", async () => {
  DATA = await (await fetch("scores.json")).json();
  MODEL = await (await fetch("model.json")).json();
  document.getElementById("updated").textContent =
    "Updated " + DATA.generated_at.replace("T"," ") +
    (DATA.weather.precip_now>0 ? " - raining, courts closed" : "");
  map.addSource("courts",{type:"geojson",data:toGeoJSON(DATA.scores)});
  map.addLayer({id:"courts",type:"circle",source:"courts",paint:{
    "circle-radius":["interpolate",["linear"],["zoom"],10,5,13,8],
    "circle-color":["match",["get","band"],"walk-on",COLORS["walk-on"],
      "short",COLORS["short"],"30-60 min",COLORS["30-60 min"],COLORS["1h+"]],
    "circle-stroke-width":1,"circle-stroke-color":"#333"}});
  map.on("click","courts",e=>{const p=e.features[0].properties;
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML(`<b>${p.name}</b> (${p.court_count} courts)<br>Expected wait: <b>${p.band}</b><br><span style="color:#555;font-size:12px">${(p.popup_lines||[]).join("<br>")}</span><br><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}" target="_blank" rel="noopener">Google Maps</a> &middot; <a href="https://maps.apple.com/?ll=${p.lat},${p.lon}&q=${encodeURIComponent(p.name)}" target="_blank" rel="noopener">Apple Maps</a>`)
      .addTo(map);});
  map.on("mouseenter","courts",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","courts",()=>map.getCanvas().style.cursor="");
});
function toGeoJSON(scores){return {type:"FeatureCollection",
  features:scores.map(s=>({type:"Feature",
    geometry:{type:"Point",coordinates:[s.lon,s.lat]},properties:s}))};}
async function ensureWx(){
  if (Object.keys(WXP).length) return;
  try{
    const wx = await (await fetch("https://api.open-meteo.com/v1/forecast?latitude=40.78&longitude=-73.97&hourly=precipitation&timezone=America%2FNew_York&forecast_days=16")).json();
    wx.hourly.time.forEach((t,i)=>WXP[t]=wx.hourly.precipitation[i]||0);
  }catch(e){}
}
function recompute(v){
  // v = "YYYY-MM-DDTHH:MM" interpreted as NYC time
  const day=v.slice(0,10), hour=+v.slice(11,13);
  const dow=new Date(day+"T12:00:00").getDay(); // weekday of that calendar date
  const hk=day+"T"+String(hour).padStart(2,"0")+":00";
  const hasWx=hk in WXP;
  let recent=0;
  for(let h=1;h<=6;h++){
    const d2=new Date(Date.UTC(+day.slice(0,4),+day.slice(5,7)-1,+day.slice(8,10),hour-h));
    const k=d2.toISOString().slice(0,10)+"T"+String(d2.getUTCHours()).padStart(2,"0")+":00";
    recent+=WXP[k]||0;}
  const wm=hasWx?wmod(WXP[hk]||0,recent):1.0;
  const r=MODEL.reservation, useRes=(day===r.applies_to);
  const scores=DATA.scores.map(s=>{
    const f=MODEL.facilities[s.park_id]||{mult:MODEL.default_prior};
    let sc;
    if(f.curve){const raw=(f.curve[String(dow)]||{})[String(hour)]??0; sc=f.mult*(raw/100.0);}
    else{sc=baseline(hour,dow)*f.mult;}
    sc*=wm;
    if(useRes&&r.modifiers[s.park_id]) sc*=r.modifiers[s.park_id];
    return {...s,band:band(sc),score:+sc.toFixed(2)};});
  map.getSource("courts").setData(toGeoJSON(scores));
  const note=document.getElementById("pnote");
  let bits=[`Forecast for ${day} ${String(hour).padStart(2,"0")}:00 NYC time.`];
  bits.push(hasWx?"Weather forecast applied.":"No weather data this far out - priors only.");
  if(useRes&&Object.keys(r.modifiers).length) bits.push("Includes tonight's reservation bookings for this date.");
  else bits.push("Reservation bookings only apply to tomorrow.");
  note.textContent=bits.join(" ");}
document.getElementById("when").addEventListener("change", async e=>{
  if(!e.target.value) return;
  try{ await ensureWx(); recompute(e.target.value); }
  catch(err){ document.getElementById("pnote").textContent="Forecast error: "+err.message; }});
document.getElementById("now").addEventListener("click", ()=>{
  document.getElementById("when").value="";
  map.getSource("courts").setData(toGeoJSON(DATA.scores));
  document.getElementById("pnote").textContent="Showing current conditions. Pick a date + time (NYC time) to forecast.";});
</script></body></html>
