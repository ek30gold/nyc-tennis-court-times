<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Tennis Wait Times</title>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<style>body{margin:0;font-family:system-ui}#map{height:100vh}.legend{position:fixed;bottom:12px;left:12px;background:#fff;padding:8px 10px;border-radius:6px;font-size:12px;box-shadow:0 1px 4px #0003;max-width:280px}.picker{position:fixed;top:12px;left:12px;background:#fff;padding:8px 10px;border-radius:6px;font-size:13px;box-shadow:0 1px 4px #0003}.picker input{font-size:13px}.picker .note{color:#777;font-size:11px;max-width:230px}
#nearlist{font-size:12px;margin-top:4px}
#nearlist .row{padding:3px 0;border-top:1px solid #eee;cursor:pointer}
#nearlist .dot{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:5px}
#updated{margin-top:4px;color:#555}
#stale{margin-top:4px;padding:3px 6px;border-radius:4px;background:#ffe4e4;color:#a11;font-weight:600}
#covnote{margin-top:4px;color:#777}
.err{color:#a11;font-weight:600}
.hollow{opacity:.55}</style>
</head><body>
<div id="map"></div>
<div class="picker">
<b>Forecast wait for:</b><br>
<input type="datetime-local" id="when"> <button id="now">Now</button> <button id="nearme">Near me</button> <button id="orbit">UES orbit</button>
<div class="note" id="pnote">Showing current conditions. Pick a date + time (NYC time) to forecast.</div>
<div id="nearlist"></div>
</div>
<div class="legend">
<b>Expected wait</b><br>
<span style="color:#2ca02c">&#9679;</span> walk-on &nbsp;
<span style="color:#ffd400">&#9679;</span> short &nbsp;
<span style="color:#ff7f0e">&#9679;</span> 30-60 min &nbsp;
<span style="color:#d62728">&#9679;</span> 1h+ &nbsp;
<span style="color:#7f7f7f">&#9679;</span> indoor (paid) &nbsp;
<span style="color:#4a4a4a">&#9679;</span> closed (dark/rain) &nbsp;
<span style="color:#bbbbbb">&#9679;</span> no data
<div id="covnote" hidden>Faded, thin-outlined dots have no venue-specific data - they show a generic city-wide pattern only.</div>
<div id="updated"></div>
<div id="stale" hidden></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
window.addEventListener("error",e=>console.warn("page error:",e.message));
window.addEventListener("unhandledrejection",e=>console.warn("page rejection:",e.reason));
const COLORS = {"walk-on":"#2ca02c","short":"#ffd400","30-60 min":"#ff7f0e","1h+":"#d62728","indoor":"#7f7f7f","closed":"#4a4a4a","unknown":"#bbbbbb"};
const STALE_MIN = 90;               // data older than this gets a visible warning
const WXWIND={}, WXGUST={};
const HTML_ESC = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
function esc(s){return String(s===null||s===undefined?"":s).replace(/[&<>"']/g,c=>HTML_ESC[c]);}
// band(): non-finite must NOT fall through to the most alarming red band.
function band(s){
  if(!Number.isFinite(s)) return "unknown";
  return s<0.35?"walk-on":s<0.65?"short":s<1.1?"30-60 min":"1h+";}
// Ported verbatim from scripts/compute_scores.py:baseline(). weekday is Mon=0.
function baseline(hour, wd){
  if(hour<6||hour>=21) return 0.05;            // overnight: courts shut
  const ep=Math.exp(-(((hour-18.5)/2.5)**2)), mp=Math.exp(-(((hour-10)/2.5)**2));
  const base=0.25+(wd<5?0.55*ep:0.65*mp);
  return Math.min(base,1.0);}
function wmod(pNow, recent){return pNow>0?0.0:(recent>1.0?0.75:1.0);}
function tempMult(c){if(c==null)return 1.0;if(c<4)return 0.55;if(c<10)return 0.8;if(c<16)return 0.9;if(c<29)return 1.0;if(c<35)return 0.95;return 0.8;}
function windMult(speed,gust){const v=Math.max(Number.isFinite(speed)?speed:0,Number.isFinite(gust)?gust:0);return v<20?1.0:v<30?0.85:v<40?0.65:0.45;}
function nycToday(){return new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"});}
function nycHour(){return +new Date().toLocaleString("en-US",{timeZone:"America/New_York",hour12:false,hour:"2-digit"})%24;}
// Monday=0 .. Sunday=6, matching priors.json curves and the Python baseline.
// Noon-anchored so the parse is immune to the browser's UTC offset.
function dowMon0(day){return (new Date(day+"T12:00:00").getDay()+6)%7;}
function bandLabel(b,reason){
  if(b==="closed") return reason==="rain"?"closed (rain)":reason==="dark"?"closed (dark)":"closed";
  if(b==="indoor") return "indoor (paid bubble)";
  if(b==="unknown") return "no data";
  return b||"no data";}
function addDays(day,n){const d=new Date(day+"T12:00:00");d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);}
// ---- timestamps / staleness -------------------------------------------------
function tzOffsetMs(utcMs, tz){
  const p={};
  for(const q of new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,
      year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})
      .formatToParts(new Date(utcMs))) p[q.type]=q.value;
  let h=+p.hour; if(h===24)h=0;
  return Date.UTC(+p.year,+p.month-1,+p.day,h,+p.minute,+p.second)-utcMs;}
function parseStamp(s){
  if(!s||typeof s!=="string") return null;
  const t=s.trim();
  if(/(Z|[+-]\d{2}:?\d{2})$/.test(t.slice(10))){            // tz-aware ISO-8601
    const ms=Date.parse(t); return Number.isFinite(ms)?ms:null;}
  const guess=Date.parse(t+"Z");                            // legacy naive form = NYC wall clock
  if(!Number.isFinite(guess)) return null;
  let ms=guess-tzOffsetMs(guess,"America/New_York");
  ms=guess-tzOffsetMs(ms,"America/New_York");               // one refinement pass over a DST edge
  return ms;}
function fmtAge(ms){
  const m=Math.floor(ms/60000);
  if(m<1) return "less than a minute";
  if(m<60) return m+" min";
  return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";}
function fmtET(ms){return new Date(ms).toLocaleString("en-US",{timeZone:"America/New_York",
  month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}
function staleness(stampMs, nowMs){
  if(stampMs==null) return {ok:false, text:"age unknown", stale:true};
  const age=nowMs-stampMs;
  if(age< -10*60000) return {ok:false, text:"timestamp is in the future", stale:true};
  if(age<0) return {ok:true, text:"just now", stale:false};
  return {ok:true, text:fmtAge(age)+" ago", stale:age>STALE_MIN*60000, ageMin:age/60000};}
// ---- daylight ---------------------------------------------------------------
function nthSundayDom(y,m0,n){const first=new Date(Date.UTC(y,m0,1)).getUTCDay();
  return 1+((7-first)%7)+7*(n-1);}
// US DST: 2nd Sunday of March .. 1st Sunday of November (computed, not hardcoded).
function isEDT(day){
  const y=+day.slice(0,4), m=+day.slice(5,7), d=+day.slice(8,10);
  if(m<3||m>11) return false;
  if(m>3&&m<11) return true;
  return m===3 ? d>=nthSundayDom(y,2,2) : d<nthSundayDom(y,10,1);}
function sunApprox(day){
  // NOAA approximation, good to ~5 min; fallback when beyond the forecast window
  const y=+day.slice(0,4), dt=new Date(day+"T12:00:00");
  const N=Math.floor((dt-new Date(y,0,0))/864e5);
  const decl=-23.44*Math.cos(2*Math.PI*(N+10)/365.25)*Math.PI/180, lat=40.78*Math.PI/180;
  const cosH=-Math.tan(lat)*Math.tan(decl);
  const dayH=2*Math.acos(Math.min(1,Math.max(-1,cosH)))*180/Math.PI/15;
  let noon=12+(-73.97/15)-(-5);                    // solar noon in EST
  if(isEDT(day)) noon+=1;                          // EDT
  return {rise:Math.ceil(noon-dayH/2), set:Math.round(noon+dayH/2)};}
function sunsetHour(day){
  if(WXSUN[day]!=null) return WXSUN[day];
  if(day===nycToday()&&MODEL&&MODEL.sunset_today!=null) return MODEL.sunset_today;
  return sunApprox(day).set;}
function sunriseHour(day){
  if(WXRISE[day]!=null) return WXRISE[day];
  return sunApprox(day).rise;}
function isDark(day,hour,lighted){
  if(lighted) return false;
  return hour>=sunsetHour(day)||hour<sunriseHour(day);}
// ---- state ------------------------------------------------------------------
function blockWindows(hoursMap){
  const hs=Object.keys(hoursMap||{}).filter(h=>hoursMap[h]>0).map(Number).sort((a,b)=>a-b);
  const wins=[];
  for(const x of hs){
    if(wins.length&&x===wins[wins.length-1][1]) wins[wins.length-1][1]=x+1;
    else wins.push([x,x+1,0]);}
  for(const w of wins){let mx=0;for(let x=w[0];x<w[1];x++)mx=Math.max(mx,hoursMap[String(x)]||0);w[2]=mx;}
  return wins;}
function leagueLines(day, parkId, courtCount){
  const days=(MODEL&&MODEL.permits&&MODEL.permits.days)||{};
  const pm={}; Object.entries(days[day]||{}).forEach(([hh,pm2])=>{pm[hh]=pm2[parkId]||0;});
  return blockWindows(pm).map(w=>"League play "+String(w[0]).padStart(2,"0")+":00-"+String(w[1]).padStart(2,"0")+":00 (up to "+w[2]+" of "+courtCount+" courts)");}
function inWindow(day, win){
  const md=day.slice(5);
  return win.start>win.end ? (md>=win.start||md<=win.end) : (win.start<=md&&md<=win.end);}
const map = new maplibregl.Map({container:"map",
  style:"https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center:[-73.95,40.73], zoom:10.5});
window.__t={map};
let DATA=null, MODEL=null, WXP={}, WXT={}, WXSUN={}, WXRISE={};
let WXSTATE="none", WXERR="", WXMAXDAY=null;
let CURRENT=null;            // last rendered FeatureCollection (no private _data reads)
let AGETIMER=null;
function el(id){return document.getElementById(id);}
function toGeoJSON(scores){return {type:"FeatureCollection",
  features:scores.map(s=>({type:"Feature",
    geometry:{type:"Point",coordinates:[s.lon,s.lat]},properties:s}))};}
function setCourts(scores){
  CURRENT=toGeoJSON(scores);
  const src=map.getSource&&map.getSource("courts");
  if(src) src.setData(CURRENT);
  const cn=el("covnote");
  if(cn) cn.hidden=!scores.some(s=>s&&s.coverage);
  return CURRENT;}
function features(){return CURRENT&&CURRENT.features?CURRENT.features:null;}
function dataError(msg){
  const u=el("updated"); if(u){u.className="err";u.textContent=msg;}
  const p=el("pnote"); if(p){p.className="note err";p.textContent=msg;}
  const s=el("stale"); if(s) s.hidden=true;}
// ---- honesty fields (absent in scores.json generated before they existed) ----
function coverageLine(cov){
  if(cov==="curve") return "Based on: venue-specific demand curve";
  if(cov==="lore")  return "Based on: local knowledge for this venue";
  if(cov==="default") return "Based on: generic city-wide pattern (no venue-specific data)";
  return null;}
function demandLine(src){
  if(src==="near") return "Demand signal: bookings at nearby reservable courts";
  if(src==="citywide") return "Demand signal: citywide booking level";
  if(src==="none") return "Demand signal: none (no booking data for this site)";
  return null;}
function popupLines(p){
  let lines=p.popup_lines||[];
  if(typeof lines==="string"){try{lines=JSON.parse(lines);}catch(_){lines=lines?[lines]:[];}}
  if(!Array.isArray(lines)) lines=[];
  const sel=window.__selDay, today=nycToday();
  if(sel&&sel!==today){
    const genDay=(DATA&&typeof DATA.generated_at==="string")?DATA.generated_at.slice(0,10):today;
    lines=lines
      .filter(l=>String(l).indexOf("League play")!==0)
      // present-tense measurements are about the generation date, not the picked one
      .map(l=>String(l).indexOf("Citywide demand today:")===0
        ? "Measured "+genDay+" (not "+sel+"): "+String(l).slice("Citywide demand today:".length).trim()
        : l)
      .concat(leagueLines(sel,p.park_id,p.court_count));}
  const cl=coverageLine(p.coverage); if(cl) lines=lines.concat([cl]);
  const dl=demandLine(p.demand_source); if(dl) lines=lines.concat([dl]);
  return lines;}
function popupHTML(p,withLinks){
  const head=`<b>${esc(p.name)}</b> (${esc(p.court_count)} courts)<br>Expected wait: <b>${esc(bandLabel(p.band,p.closed_reason))}</b>`;
  const body=`<br><span style="color:#555;font-size:12px">${popupLines(p).map(esc).join("<br>")}</span>`;
  if(!withLinks) return head+body;
  const ll=encodeURIComponent(p.lat)+","+encodeURIComponent(p.lon);
  return head+body+
    `<br><a href="https://www.google.com/maps/search/?api=1&query=${ll}" target="_blank" rel="noopener">Google Maps</a>`+
    ` &middot; <a href="https://maps.apple.com/?ll=${ll}&q=${encodeURIComponent(p.name)}" target="_blank" rel="noopener">Apple Maps</a>`+
    ` &middot; <a href="https://github.com/ek30gold/nyc-tennis-court-times/issues/new?title=${encodeURIComponent("Wait report: "+p.name)}&body=${encodeURIComponent("Park: "+p.name+" ("+p.park_id+")\nWhen: \nPredicted: "+p.band+"\nActual wait: \n")}" target="_blank" rel="noopener">Report actual wait</a>`;}
function rowHTML(p,d,extra){
  return `<div class="row"><span class="dot" style="background:${esc(COLORS[p.band]||"#999")}"></span>${esc(p.name)} - ${esc(bandLabel(p.band,p.closed_reason))}, ${esc(d<1?Math.round(d*1000)+" m":d.toFixed(1)+" km")}${extra?' <span style="color:#999">'+esc(extra)+"</span>":""}</div>`;}
// ---- "now" view: server bands, plus the two things the snapshot can't know ---
function liveScores(){
  if(!DATA||!Array.isArray(DATA.scores)) return [];
  const raining=!!(DATA.weather&&DATA.weather.precip_now>0);
  const today=nycToday(), hr=nycHour();
  return DATA.scores.map(s=>{
    const o={...s};
    const lit=!!((MODEL&&MODEL.facilities&&MODEL.facilities[s.park_id]||{}).lighted);
    if(o.band!=="indoor"){
      if(MODEL&&hr<sunriseHour(today)&&!lit){o.band="closed";o.closed_reason=o.closed_reason||"dark";}
      else if(raining){o.band="closed";o.closed_reason=o.closed_reason||"rain";}}
    return o;});}
function renderUpdated(){
  if(!DATA) return;
  const u=el("updated"), st=el("stale");
  const ms=parseStamp(DATA.generated_at);
  const s=staleness(ms,Date.now());
  const wx=(DATA.weather&&DATA.weather.precip_now>0)?" - raining, outdoor courts closed":"";
  u.className="";
  u.textContent = ms==null
    ? "Updated "+String(DATA.generated_at||"unknown")+" (unreadable timestamp)"+wx
    : "Updated "+fmtET(ms)+" ET - "+s.text+wx;
  if(s.stale){
    st.hidden=false;
    st.textContent = ms==null
      ? "Can't tell how old this data is - reload, and treat the colours as rough."
      : s.ok ? "Stale data: "+s.text+". The hourly refresh has not run; bands may be well out of date."
             : "Clock mismatch: the data is timestamped in the future. Ages below are unreliable.";
  } else st.hidden=true;}
map.on("load", async () => {
  try{
    const res=await fetch("scores.json");
    if(!res.ok) throw new Error("HTTP "+res.status);
    DATA=await res.json();
    if(!DATA||!Array.isArray(DATA.scores)) throw new Error("scores.json has no scores array");
  }catch(e){
    console.warn("scores.json unavailable:",e&&e.message);
    dataError("Couldn't load court data ("+(e&&e.message||"unknown error")+") - try reloading.");
    return;
  }
  try{
    const mres=await fetch("model.json");
    if(!mres.ok) throw new Error("HTTP "+mres.status);
    MODEL=await mres.json();
  }catch(e){ console.warn("model.json unavailable - forecast picker disabled:",e&&e.message); }
  renderUpdated();
  AGETIMER=setInterval(renderUpdated,60000);
  const w=el("when"), today=nycToday();
  w.min=today+"T00:00"; w.max=addDays(today,365)+"T23:00";
  setCourts(liveScores());
  map.addSource("courts",{type:"geojson",data:CURRENT});
  map.addLayer({id:"courts",type:"circle",source:"courts",paint:{
    "circle-radius":["interpolate",["linear"],["zoom"],10,7,13,10],
    "circle-color":["match",["get","band"],"walk-on",COLORS["walk-on"],
      "short",COLORS["short"],"30-60 min",COLORS["30-60 min"],
      "indoor",COLORS["indoor"],"closed",COLORS["closed"],
      "unknown",COLORS["unknown"],COLORS["1h+"]],
    // generic-pattern facilities read as less authoritative: faded + hairline outline.
    // `coverage` missing (pre-contract scores.json) -> full opacity, i.e. today's look.
    "circle-opacity":["case",["==",["get","coverage"],"default"],0.5,1],
    "circle-stroke-width":["case",["==",["get","coverage"],"default"],0.6,1],
    "circle-stroke-color":"#333"}});
  map.on("click","courts",e=>{
    const p=e.features[0].properties;
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML(popupHTML(p,true)).addTo(map);});
  map.on("mouseenter","courts",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","courts",()=>map.getCanvas().style.cursor="");
});
async function ensureWx(){
  if (WXSTATE==="ok") return;
  try{
    const res=await fetch("https://api.open-meteo.com/v1/forecast?latitude=40.78&longitude=-73.97&hourly=precipitation,temperature_2m,wind_speed_10m,wind_gusts_10m&daily=sunset,sunrise&timezone=America%2FNew_York&forecast_days=16");
    if(!res.ok) throw new Error("HTTP "+res.status);
    const wx=await res.json();
    wx.hourly.time.forEach((t,i)=>{WXP[t]=wx.hourly.precipitation[i]||0;WXT[t]=wx.hourly.temperature_2m[i];
      WXWIND[t]=(wx.hourly.wind_speed_10m||[])[i];WXGUST[t]=(wx.hourly.wind_gusts_10m||[])[i];});
    ((wx.daily||{}).time||[]).forEach((d,i)=>{
      const ss=(wx.daily.sunset||[])[i], sr=(wx.daily.sunrise||[])[i];
      if(ss) WXSUN[d]=+ss.split("T")[1].slice(0,2);
      // conservative: an unlit court is dark for the whole hour sunrise falls in
      if(sr){const hm=sr.split("T")[1];WXRISE[d]=+hm.slice(0,2)+(+hm.slice(3,5)>0?1:0);}});
    const days=Object.keys(WXP).map(k=>k.slice(0,10)).sort();
    WXMAXDAY=days.length?days[days.length-1]:null;
    WXSTATE="ok"; WXERR="";
  }catch(e){
    WXSTATE="fail"; WXERR=(e&&e.message)||String(e);
    console.warn("weather fetch failed:",WXERR);}
}
function wxNote(day, hasWx){
  if(hasWx) return "Weather forecast applied (rain, recent rain, temperature, and wind).";
  if(WXSTATE==="fail") return "Weather lookup failed ("+WXERR+") - priors only, no rain or temperature applied.";
  if(WXMAXDAY&&day>WXMAXDAY) return "Beyond the 16-day weather forecast horizon - priors only.";
  return "No weather data for that hour - priors only.";}
function resNote(day, r, useRes, dayMods){
  if(useRes&&Object.keys(r.modifiers||{}).length) return "Includes tonight's reservation bookings for this date.";
  if(Object.keys(dayMods).length) return "Includes reservations booked so far for this date - more will book as it approaches, so treat busy-ness as a floor.";
  if(!r.captured_at) return "Reservation booking data unavailable (last capture failed) - not included.";
  const fdays=Object.keys(r.forecast||{}).sort();
  const maxDay=fdays.length?fdays[fdays.length-1]:(r.applies_to||null);
  if(maxDay&&day>maxDay) return "Reservation bookings only cover the next ~29 days at reservable sites.";
  return "No reservation bookings recorded yet for this date at the reservable sites.";}
function recompute(v){
  // v = "YYYY-MM-DDTHH:MM" interpreted as NYC time
  const day=v.slice(0,10), hour=+v.slice(11,13);
  const today=nycToday();
  if(daysBetween(today,day)<0||daysBetween(today,day)>365){
    el("pnote").textContent="Pick a date between today and a year out - beyond that there is nothing to forecast from.";
    return;}
  window.__selDay=day;
  const dow=dowMon0(day);                              // Mon=0 .. Sun=6
  const cal=(MODEL&&MODEL.calendar)||{dates:(MODEL&&MODEL.holidays)||{},ranges:[]};
  let hday=(cal.dates||{})[day];
  if(!hday) hday=(cal.ranges||[]).find(r=>r.start<=day&&day<=r.end);
  const dowEff=(hday&&hday.kind==="holiday")?5:dow;    // holidays behave like Saturdays (Mon=0 -> 5 = Sat)
  const hk=day+"T"+String(hour).padStart(2,"0")+":00";
  const hasWx=hk in WXP;
  let recent=0;
  for(let h=1;h<=6;h++){
    const d2=new Date(Date.UTC(+day.slice(0,4),+day.slice(5,7)-1,+day.slice(8,10),hour-h));
    const k=d2.toISOString().slice(0,10)+"T"+String(d2.getUTCHours()).padStart(2,"0")+":00";
    recent+=WXP[k]||0;}
  const wm=hasWx?wmod(WXP[hk]||0,recent):1.0;
  const raining=hasWx&&(WXP[hk]||0)>0;
  const r=MODEL.reservation||{modifiers:{},forecast:{}};
  const useRes=(day===r.applies_to);
  const dayMods=(r.forecast||{})[day]||{};
  const DEF=(MODEL.default_prior!=null)?MODEL.default_prior:1.0;
  const scores=DATA.scores.map(s=>{
    const f=MODEL.facilities[s.park_id]||{mult:DEF};
    const mult=(f.mult!=null)?f.mult:DEF;
    let sc, curveHit=false;
    if(f.curve){
      const raw=(f.curve[String(dowEff)]||{})[String(hour)];
      if(raw!=null){sc=mult*(raw/100.0);curveHit=true;}
      else sc=baseline(hour,dowEff)*mult;    // hour absent from the curve != zero demand
    } else sc=baseline(hour,dowEff)*mult;
    const coverage=curveHit?"curve":(mult!==DEF?"lore":"default");
    sc*=wm;
    if(useRes&&r.modifiers[s.park_id]) sc*=r.modifiers[s.park_id];
    else if(dayMods[s.park_id]) sc*=dayMods[s.park_id];
    const pb=((((MODEL.permits||{}).days)||{})[day]||{})[String(hour)]||{};
    const blocked=pb[s.park_id]||0;
    if(blocked&&s.court_count) sc*=1+Math.min(blocked/s.court_count,0.75);
    const win=(MODEL.season_windows||{})[s.park_id];
    const lit=!!(MODEL.facilities[s.park_id]||{}).lighted;
    const indoorSel=!!(win&&inWindow(day,win));
    if(!indoorSel){
      if(hasWx&&WXT[hk]!=null) sc*=tempMult(WXT[hk]);
      if(hasWx) sc*=windMult(WXWIND[hk],WXGUST[hk]);
      if(hday&&hday.kind==="school_closed"&&dow<5&&hour>=9&&hour<=16) sc*=1.2;
      const dm=(((MODEL.demand||{}).dates||{})[day]||{})[s.park_id];
      if(dm) sc*=dm;
    }
    let bd, reason=null;
    if(indoorSel) bd="indoor";
    else if(isDark(day,hour,lit)){bd="closed";reason="dark";}
    else if(raining){bd="closed";reason="rain";}   // rain must never render green
    else bd=band(sc);
    const out={...s,band:bd,score:Number.isFinite(sc)?+sc.toFixed(2):null,coverage:coverage};
    if(reason) out.closed_reason=reason; else delete out.closed_reason;
    if(day!==today) delete out.demand_source;      // a measurement about today says nothing about a forecast day
    return out;});
  setCourts(scores);
  let bits=[`Forecast for ${day} ${String(hour).padStart(2,"0")}:00 NYC time.`];
  bits.push(wxNote(day,hasWx));
  if(raining) bits.push("Rain at that hour: outdoor courts treated as closed, not empty.");
  if(hday) bits.push(hday.name+(hday.kind==="holiday"?" - weekend-level demand assumed.":" - schools closed, daytime demand boosted."));
  const demOk=(((MODEL.demand||{}).dates||{})[day]);
  if(demOk) bits.push(day===today?"Includes today's measured booking demand from reservable courts.":"Includes citywide bookings so far for this date - still filling, treat walk-up demand as a floor.");
  bits.push(resNote(day,r,useRes,dayMods));
  el("pnote").className="note";
  el("pnote").textContent=bits.join(" ");}
el("when").addEventListener("change", async e=>{
  if(!e.target.value) return;
  if(!DATA){ dataError("Couldn't load court data - try reloading."); return; }
  if(!MODEL){ el("pnote").textContent="Forecast model unavailable - showing current conditions."; return; }
  try{ await ensureWx(); recompute(e.target.value); }
  catch(err){ el("pnote").className="note err";
    el("pnote").textContent="Forecast error: "+((err&&err.message)||err); }});
function havKm(a,b){
  const R=6371, p1=a[1]*Math.PI/180, p2=b[1]*Math.PI/180,
        dp=(b[1]-a[1])*Math.PI/180, dl=(b[0]-a[0])*Math.PI/180,
        x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));}
function openPopupFor(f){
  const p=f.properties;
  map.flyTo({center:f.geometry.coordinates,zoom:14});
  new maplibregl.Popup().setLngLat(f.geometry.coordinates).setHTML(popupHTML(p,false)).addTo(map);}
el("nearme").addEventListener("click", ()=>{
  const nl=el("nearlist");
  if(!navigator.geolocation){nl.textContent="No geolocation on this device.";return;}
  const feats=features();
  if(!feats){nl.textContent="Court data isn't loaded - try reloading the page.";return;}
  nl.textContent="Locating...";
  navigator.geolocation.getCurrentPosition(pos=>{
    const me=[pos.coords.longitude,pos.coords.latitude];
    const near=feats.map(f=>({f,d:havKm(me,f.geometry.coordinates)}))
      .sort((a,b)=>a.d-b.d).slice(0,5);
    nl.innerHTML=near.map(({f,d})=>rowHTML(f.properties,d)).join("");
    [...nl.querySelectorAll(".row")].forEach((row,i)=>row.addEventListener("click",()=>openPopupFor(near[i].f)));
    map.flyTo({center:me,zoom:12.5});
  },()=>{nl.textContent="Location denied - allow it in browser settings to use this.";},{timeout:10000});});
let ORBIT=null;
// indoor = a paid bubble you cannot walk onto: ranked below every playable
// outdoor band, above closed.
const RANK={"walk-on":0,"short":1,"30-60 min":2,"1h+":3,"indoor":4,"closed":5,"unknown":6};
el("orbit").addEventListener("click", async ()=>{
  const nl=el("nearlist");
  const feats=features();
  if(!feats){nl.textContent="Court data isn't loaded - try reloading the page.";return;}
  if(!ORBIT){ try{
      const res=await fetch("home_orbit.json");
      if(!res.ok) throw new Error("HTTP "+res.status);
      ORBIT=await res.json();
    }catch(e){ nl.textContent="Orbit list unavailable ("+((e&&e.message)||"error")+").";return; } }
  const rows=ORBIT.parks.map(o=>{
    const f=feats.find(x=>x.properties.park_id===o.park_id);
    return f?{o,f,d:havKm(ORBIT.anchor,f.geometry.coordinates)}:null;
  }).filter(Boolean).sort((a,b)=>(RANK[a.f.properties.band]??9)-(RANK[b.f.properties.band]??9)||a.d-b.d);
  nl.innerHTML="<div style='color:#777;margin:2px 0'>Home orbit from "+esc(ORBIT.anchor_label)+" - best first:</div>"
    +rows.map(({f,d,o})=>rowHTML(f.properties,d,o.why)).join("");
  [...nl.querySelectorAll(".row")].forEach((row,i)=>row.addEventListener("click",()=>openPopupFor(rows[i].f)));
});
el("now").addEventListener("click", async ()=>{
  el("when").value="";
  window.__selDay=null;
  if(!DATA){ dataError("Couldn't load court data - try reloading."); return; }
  el("pnote").className="note";
  el("pnote").textContent="Refreshing current conditions...";
  try{                                  // "Now" must mean now, not page-load time
    const res=await fetch("scores.json",{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const fresh=await res.json();
    if(fresh&&Array.isArray(fresh.scores)) DATA=fresh;
    el("pnote").textContent="Showing current conditions. Pick a date + time (NYC time) to forecast.";
  }catch(e){
    console.warn("refresh failed:",e&&e.message);
    el("pnote").textContent="Showing the conditions loaded at "+
      (parseStamp(DATA.generated_at)!=null?fmtET(parseStamp(DATA.generated_at))+" ET":"page load")+
      " - couldn't refresh just now. Pick a date + time (NYC time) to forecast.";
  }
  setCourts(liveScores());
  renderUpdated();});
